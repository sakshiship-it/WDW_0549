<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to add CSS to an HTML document </title>
</head>
<body>
    <div>
        <!--div stands for division,used to group elements-->
    </div>
    <h1 style="color:blue;font-size: 45px;font-family: Arial,  sans-serif;background-color: rgb(231, 114, 114,0.4);">How to add CSS to an HTML document</h1>
    <!--rgb-0-255,a-alpha-for transparency-like 0.4 its value is from 0 to 1,we define color with help of rgba-->
    <ol>
        <li>Inline</li>
        <li>Internal</li>
        <li>External</li>
    </ol>
    
</body>
</html>
