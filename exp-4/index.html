<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>
    
    <form action="#" method="post" align="center"
          style="border: 2px solid black; width: 290px; margin: auto; padding: 10px;">
          <h1 align="center">Hotel Room Booking Form</h1>


        <!-- Name -->
         <fieldset>
            <legend><b>Personal Information</b></legend>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>
        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!-- Phone -->
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>
        </fieldset>
        <fieldset>
            <legend><b>Booking Details</b></legend>
        


        <!-- Check-in Date -->
        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" name="checkin">
        <br><br>

        <!-- Check-out Date -->
        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" name="checkout">
        <br><br>

        <!-- Room Type -->
        <label for="room">Room Type:</label>
        <select id="room" name="room">
            <option>Single Room</option>
            <option>Double Room</option>
            <option>Deluxe Room</option>
        </select>
        <br><br>

        <!-- Number of Guests -->
        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" min="1" max="10">
        <br><br>
        </fieldset>

        <!-- Special Requests -->
        <label for="requests">Special Requests:</label>
        <br>
        <textarea id="requests" name="requests"
                  rows="4" cols="30"></textarea>
        <br><br>

        <button type="submit">Book Now</button>
        <button type="reset">Reset Form</button>

    </form>
</body>
</html>
